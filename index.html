<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ВАРТА — внутрішній ситуаційний центр</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600&family=Unbounded:wght@600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0c1a2d;--ink2:#13294a;--line:#7fb3d5;--paper:#e9efe8;--amber:#f2b84b;--coral:#ef6f5e;--mute:#8aa3bd}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--ink);color:var(--paper);font:14px/1.45 Onest,system-ui,sans-serif}
#map{position:absolute;inset:0;background:var(--ink)}
/* Стилізація: OSM-плитки перефарбовано в синьо-кресленну гаму («ціанотипія») */
.leaflet-tile-pane{filter:invert(1) hue-rotate(188deg) saturate(.75) brightness(.95) contrast(1.05)}
#map::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:500;
 background:radial-gradient(ellipse at center,transparent 55%,rgba(5,12,24,.75)),
 repeating-linear-gradient(0deg,rgba(127,179,213,.05) 0 1px,transparent 1px 48px),
 repeating-linear-gradient(90deg,rgba(127,179,213,.05) 0 1px,transparent 1px 48px)}
header{position:absolute;z-index:700;top:12px;left:12px;right:12px;display:flex;gap:12px;align-items:center;pointer-events:none}
header>*{pointer-events:auto}
.brand{background:var(--ink);border:1px solid var(--line);padding:8px 14px;border-radius:2px 14px 2px 14px}
.brand b{font:600 18px Unbounded,sans-serif;letter-spacing:.14em}
.brand small{display:block;color:var(--mute);font-size:11px}
.stat{background:rgba(12,26,45,.88);border:1px solid #27466b;padding:6px 12px;border-radius:2px 10px 2px 10px}
.stat b{font:600 20px Unbounded,sans-serif;color:var(--amber)}
.sp{flex:1}
button{font:600 13px Onest,sans-serif;cursor:pointer;color:var(--ink);background:var(--amber);border:0;padding:10px 16px;border-radius:2px 12px 2px 12px}
button.ghost{background:transparent;color:var(--paper);border:1px solid var(--line)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--paper);outline-offset:2px}
#legend{position:absolute;z-index:700;left:12px;bottom:28px;background:rgba(12,26,45,.9);border:1px solid #27466b;padding:8px 10px;border-radius:2px 12px 2px 12px}
#legend label{display:flex;gap:8px;align-items:center;padding:2px 0;cursor:pointer}
.dot{width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 30%,transparent)}
.pt{width:16px;height:16px;border-radius:50%;background:var(--c);border:2px solid var(--ink);animation:p 2.4s ease-out infinite}
.pt.old{animation:none;opacity:.7}
@keyframes p{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 70%,transparent)}100%{box-shadow:0 0 0 22px transparent}}
@media (prefers-reduced-motion:reduce){.pt{animation:none}}
#panel{position:absolute;z-index:800;top:0;right:0;bottom:0;width:min(380px,100%);background:var(--ink);border-left:1px solid var(--line);padding:16px;overflow:auto;transform:translateX(105%);transition:transform .25s}
#panel.open{transform:none}
#panel h2{font:600 15px Unbounded,sans-serif;margin:0 0 4px}
.hint{color:var(--mute);margin:0 0 12px}
label.f{display:block;margin:10px 0 0;color:var(--mute);font-size:12px}
input,select,textarea{width:100%;margin-top:3px;background:var(--ink2);color:var(--paper);border:1px solid #27466b;padding:8px;border-radius:2px 8px 2px 8px;font:inherit}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chk{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px}
.chk label{display:flex;gap:4px;align-items:center;color:var(--paper)}
.chk input{width:auto;margin:0}
.actions{display:flex;gap:8px;margin-top:16px}
#msg{margin-top:10px;color:var(--coral)}
body.placing #map{cursor:crosshair}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--ink);color:var(--paper);border:1px solid var(--line);border-radius:2px 12px 2px 12px}
.leaflet-popup-content b{font-family:Unbounded,sans-serif;font-size:13px}
.leaflet-control-attribution{background:rgba(12,26,45,.8)!important;color:var(--mute)!important}
.leaflet-control-attribution a{color:var(--line)!important}
a.btn{font:600 13px Onest,sans-serif;text-decoration:none;color:var(--paper);border:1px solid var(--line);padding:10px 16px;border-radius:2px 12px 2px 12px;background:rgba(12,26,45,.88)}
#tl{position:absolute;z-index:700;left:260px;right:12px;bottom:28px;background:rgba(12,26,45,.94);border:1px solid #27466b;padding:8px 12px;border-radius:2px 12px 2px 12px}
#tl .top{display:flex;gap:10px;align-items:center}
#tl .top b{font:600 13px Unbounded,sans-serif}
#tlBody{margin-top:8px}
#tlBody .ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#tlBody input[type=date],#tlBody select{width:auto;margin:0}
#tlBody button{padding:8px 14px}
#clock{font:600 20px Unbounded,sans-serif;color:var(--amber);min-width:76px}
#sl{width:100%;margin:10px 0 0;padding:0;accent-color:var(--amber)}
.ticks{display:flex;justify-content:space-between;color:var(--mute);font-size:11px}
#tgl{padding:2px 10px;background:transparent;color:var(--paper);border:1px solid var(--line)}
@media (max-width:760px){#tl{left:12px;bottom:200px}header{flex-wrap:wrap}}
#banner{position:absolute;z-index:900;top:78px;left:50%;transform:translateX(-50%);max-width:min(560px,92vw);padding:10px 16px;border-radius:2px 12px 2px 12px;background:var(--coral);color:var(--ink);font-weight:600;cursor:pointer;box-shadow:0 6px 24px rgba(0,0,0,.5)}
#banner.info{background:var(--amber)}
.seg{display:flex;gap:4px;margin-bottom:8px}
.seg button{padding:5px 8px;background:transparent;color:var(--paper);border:1px solid var(--line);border-radius:2px 8px 2px 8px;font-size:12px}
.seg button.on{background:var(--amber);color:var(--ink);border-color:var(--amber)}
.stbtn{margin-top:8px;width:100%}
.cell{background:transparent!important;border:0!important;box-shadow:none!important;color:var(--paper)!important;font:600 12px Onest,sans-serif}
.cell::before{display:none!important}
#air{position:absolute;z-index:720;top:74px;left:12px;width:min(320px,calc(100% - 24px));max-height:calc(100% - 330px);overflow:auto;background:rgba(12,26,45,.94);border:1px solid #27466b;padding:10px 12px;border-radius:2px 12px 2px 12px}
#air .top{display:flex;gap:8px;align-items:center}
#air .top b{font:600 13px Unbounded,sans-serif}
#air button{padding:6px 10px}
#air input[type=checkbox]{width:auto;margin:0}
#air .ctl{display:flex;gap:8px;align-items:center;margin:10px 0 4px;color:var(--mute)}
#air .ctl select{width:auto;margin:0;padding:4px 6px}
#aEnd{margin-top:12px;padding-top:10px;border-top:1px solid #27466b;display:flex;gap:8px}
#aEnd select{margin:0}
.arow{display:flex;gap:8px;align-items:center;padding:5px 2px;border-top:1px solid #1d3558;cursor:pointer}
.arow:hover{background:rgba(127,179,213,.08)}
.arow .t{flex:1}
.arow small{color:var(--mute)}
.arow.act small{color:var(--coral)}
.air{width:40px;height:40px;filter:drop-shadow(0 0 5px #ef6f5e) drop-shadow(0 0 1px #000)}
.air svg{display:block}
.hdl{width:18px;height:18px;border-radius:50%;background:var(--amber);border:2px solid var(--ink);box-shadow:0 0 0 4px rgba(242,184,75,.35);cursor:grab}
path.trail{filter:drop-shadow(0 0 3px rgba(239,111,94,.8))}
.endm{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:700 14px Onest,sans-serif;color:var(--ink);background:var(--c);border:2px solid var(--ink)}
.abtn{margin-top:8px;width:100%}
</style>
</head>
<body>
<div id="map"></div>
<header>
  <div class="brand"><b>ВАРТА</b><small>Візуалізація атак, реагування, тривог і аварій</small></div>
  <div class="stat"><b id="n24">–</b> за 24 год</div>
  <div class="stat"><b id="nAll">–</b> усього</div>
  <div class="sp"></div>
  <a class="btn" href="table.html">Таблиця подій</a>
  <button id="snd" class="ghost">Звук вимкнено</button>
  <button id="add">Занести подію</button>
</header>
<div id="banner" role="alert" hidden></div>
<section id="air" aria-label="Повітряні цілі">
  <div class="top"><b>Повітряні цілі</b><div class="sp"></div><button id="airNew">+ Ціль</button><button id="airTgl" class="ghost" aria-expanded="true" title="Згорнути / розгорнути">▾</button></div>
  <div id="airBody">
    <form id="airForm" hidden>
      <p class="hint" id="airHint"></p>
      <div class="row">
        <label class="f">Тип<select id="aKind"></select></label>
        <label class="f">Курс, °<input type="number" id="aHead" min="0" max="359" step="1" value="45"></label>
        <label class="f">км/год<input type="number" id="aSpeed" min="20" max="12000" step="1" value="180"></label>
      </div>
      <label class="f">Назва (необов’язково)<input id="aLabel" maxlength="40"></label>
      <div class="actions"><button type="submit" id="aOk">Запустити</button><button type="button" class="ghost" id="aCancel">Скасувати</button></div>
      <div id="aEnd" hidden>
        <select id="aReason"><option value="shot">Збито</option><option value="hit">Влучання</option><option value="lost">Втрачено</option></select>
        <button type="button" id="aEndBtn" class="ghost">Завершити ціль</button>
      </div>
    </form>
    <div class="ctl"><label><input type="checkbox" id="airAll"> Усі маршрути</label><div class="sp"></div>
      <select id="airPer" aria-label="Період"><option value="today">Сьогодні</option><option value="7d">7 діб</option><option value="all">Усе</option></select></div>
    <div id="airList"></div>
  </div>
</section>
<div id="legend"></div>
<section id="tl" aria-label="Таймлайн">
  <div class="top"><b>Таймлайн дня</b><span id="tlInfo" class="hint" style="margin:0"></span><div class="sp"></div><button id="tgl" aria-expanded="false" title="Розгорнути / згорнути">▴</button></div>
  <div id="tlBody" hidden>
    <div class="ctl">
      <input type="date" id="tlDay" aria-label="День">
      <button id="tlPlay">Старт</button>
      <button id="tlReset" class="ghost">На початок</button>
      <select id="tlSpeed" aria-label="Швидкість">
        <option value="1">Реальний час</option><option value="10">×10</option>
        <option value="60" selected>×60 (година за хвилину)</option><option value="360">×360</option>
      </select>
      <div class="sp"></div><span id="clock">00:00</span>
    </div>
    <input type="range" id="sl" min="0" max="1439" value="0" step="1" aria-label="Час доби">
    <div class="ticks"><span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>24:00</span></div>
  </div>
</section>

<aside id="panel" aria-label="Картка фіксації події">
  <h2>Картка фіксації події</h2>
  <p class="hint" id="hint">Клацніть на карті, щоб поставити точку. Її можна перетягнути.</p>
  <form id="form" hidden>
    <label class="f">Тип події<select name="type" required></select></label>
    <label class="f">Дата і час<input type="datetime-local" name="occurred_at" required></label>
    <div class="row">
      <label class="f">Широта<input name="lat" readonly></label>
      <label class="f">Довгота<input name="lng" readonly></label>
      <label class="f">Район<select name="district" required></select></label>
    </div>
    <label class="f">Адреса або орієнтир<input name="address" maxlength="200"></label>
    <label class="f">Що постраждало<select name="impact" required></select></label>
    <div class="row">
      <label class="f">Загиблі<input type="number" name="killed" min="0" value="0"></label>
      <label class="f">Поранені<input type="number" name="injured" min="0" value="0"></label>
      <label class="f">Будівлі<input type="number" name="buildings" min="0" value="0"></label>
    </div>
    <div class="f">Служби на місці</div>
    <div class="chk" id="services"></div>
    <label class="f">Статус<select name="status"><option value="new">Нова</option><option value="working">Опрацьовується</option><option value="closed">Закрита</option></select></label>
    <label class="f">Джерело<input name="source" maxlength="120" placeholder="ДСНС, поліція, мешканець"></label>
    <label class="f">Примітка<textarea name="note" rows="3" maxlength="500"></textarea></label>
    <div class="actions"><button type="submit">Зберегти</button><button type="button" class="ghost" id="cancel">Скасувати</button></div>
    <div id="msg" role="alert"></div>
  </form>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.heat/0.2.0/leaflet-heat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SB_URL = 'https://ogazzqmkkvzigwiguqtg.supabase.co';   // ← ваш проєкт
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9nYXp6cW1ra3Z6aWd3aWd1cXRnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5Mjk1MTQsImV4cCI6MjEwODUwNTUxNH0.SC6PSQAO-bAL1dHbMqVCA05E2SnrZHk0Zj4jLDjtCHk';                // ← публічний anon key
const sb = supabase.createClient(SB_URL, SB_KEY);

const TYPES = {debris:['Падіння уламків','#f2b84b'], hit:['Прямий приліт','#ef6f5e'], fire:['Пожежа','#ff9e5e'],
               infra:['Пошкодження інфраструктури','#5fd4d0'], uxo:['Нерозірваний боєприпас','#b99cff']};
const IMPACT = {residential:'Житлова забудова', critical:'Критична інфраструктура', commercial:'Комерційний об’єкт', open:'Відкрита територія'};
const DISTRICTS = ['Голосіївський','Дарницький','Деснянський','Дніпровський','Оболонський','Печерський','Подільський','Святошинський','Солом’янський','Шевченківський'];
const STATUS = {new:'нова', working:'опрацьовується', closed:'закрита'};
const SERVICES = ['ДСНС','Поліція','Швидка','Комунальники','Сапери','Енергетики'];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const map = L.map('map', {center:[50.4501,30.5234], zoom:11, minZoom:9, maxBounds:[[50.0,30.0],[50.9,31.1]]});
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:18, attribution:'© OpenStreetMap contributors'}).addTo(map);
const layer = L.layerGroup().addTo(map);
let rows = [], placing = false, draft = null;
const hidden = new Set();

// легенда-фільтр
$('#legend').innerHTML = Object.entries(TYPES).map(([k,[n,c]]) =>
  `<label><input type="checkbox" data-k="${k}" checked><span class="dot" style="--c:${c}"></span>${n}</label>`).join('');
$('#legend').onchange = e => { e.target.checked ? hidden.delete(e.target.dataset.k) : hidden.add(e.target.dataset.k); draw(); };

// форма
const f = $('#form');
f.type.innerHTML = Object.entries(TYPES).map(([k,[n]]) => `<option value="${k}">${n}</option>`).join('');
f.impact.innerHTML = Object.entries(IMPACT).map(([k,n]) => `<option value="${k}">${n}</option>`).join('');
f.district.innerHTML = '<option value="">—</option>' + DISTRICTS.map(d => `<option>${d}</option>`).join('');
$('#services').innerHTML = SERVICES.map(s => `<label><input type="checkbox" value="${s}">${s}</label>`).join('');

function draw() {
  layer.clearLayers();
  const day = Date.now() - 864e5;
  const vis = rows.filter(r => !hidden.has(r.type) && inTl(r));
  if (mode === 'heat') drawHeat(vis); else if (mode === 'grid') drawGrid(vis); else vis.forEach(r => {
    const [name, color] = TYPES[r.type] || ['?', '#fff'];
    const old = tl.on ? (tl.min - minsOf(r) > 30) : new Date(r.occurred_at) < day;
    const icon = L.divIcon({className:'', html:`<div class="pt ${old?'old':''}" style="--c:${color}"></div>`, iconSize:[16,16]});
    L.marker([r.lat, r.lng], {icon}).addTo(layer).bindPopup(
      `<b>${name}</b><br>${new Date(r.occurred_at).toLocaleString('uk-UA')}<br>${esc(r.district)} · ${IMPACT[r.impact] || ''}` +
      `<br>${esc(r.address)}<br>Загиблі: ${r.killed}, поранені: ${r.injured}, будівлі: ${r.buildings}<br>Служби: ${esc((r.services||[]).join(', '))}<br>Статус: ${STATUS[r.status]||''}<br>${esc(r.note)}<br>${stBtn(r)}`, {minWidth:230});
  });
  $('#tlInfo').textContent = tl.on ? `на карті: ${vis.length}` : '';
  $('#n24').textContent = rows.filter(r => new Date(r.occurred_at) >= day).length;
  $('#nAll').textContent = rows.length;
  drawAir();
}

async function load() {
  const {data, error} = await sb.from('incidents').select('*').order('occurred_at', {ascending:false}).limit(5000);
  if (error) { console.error(error); return; }
  rows = data; draw();
}

// режим постановки точки
$('#add').onclick = () => { placing = true; document.body.classList.add('placing'); $('#panel').classList.add('open'); $('#hint').hidden = false; f.hidden = true; };
function closePanel() { placing = false; document.body.classList.remove('placing'); $('#panel').classList.remove('open'); if (draft) { map.removeLayer(draft); draft = null; } f.hidden = true; $('#msg').textContent = ''; }
$('#cancel').onclick = closePanel;
map.on('click', e => {
  if (!placing) return;
  if (!draft) {
    draft = L.marker(e.latlng, {draggable:true}).addTo(map);
    draft.on('dragend', () => setLL(draft.getLatLng()));
  } else draft.setLatLng(e.latlng);
  setLL(e.latlng);
  f.hidden = false; $('#hint').hidden = true;
  if (!f.occurred_at.value) { const d = new Date(Date.now() - new Date().getTimezoneOffset()*6e4); f.occurred_at.value = d.toISOString().slice(0,16); }
});
function setLL(ll) { f.lat.value = ll.lat.toFixed(6); f.lng.value = ll.lng.toFixed(6); }

f.onsubmit = async e => {
  e.preventDefault();
  const fd = new FormData(f), v = Object.fromEntries(fd);
  const rec = {...v, lat:+v.lat, lng:+v.lng, killed:+v.killed, injured:+v.injured, buildings:+v.buildings,
    occurred_at:new Date(v.occurred_at).toISOString(), services:[...document.querySelectorAll('#services input:checked')].map(i => i.value)};
  const {error} = await sb.from('incidents').insert(rec);
  if (error) { $('#msg').textContent = 'Не збережено: ' + error.message; return; }
  closePanel(); f.reset(); load();
};

load();

// ---- РЕЖИМИ КАРТИ: точки / щільність / сітка 500 м ----
let mode = 'points';
const CELL_LAT = 0.0045, CELL_LNG = 0.0071;           // ≈ 500 м у Києві
function drawHeat(vis) {
  const pts = vis.map(r => [r.lat, r.lng, 0.5 + Math.min(2, r.killed*0.5 + r.injured*0.15 + r.buildings*0.05)]);
  layer.addLayer(L.heatLayer(pts, {radius:30, blur:24, minOpacity:.35, gradient:{.2:'#2b6cb0', .5:'#5fd4d0', .75:'#f2b84b', 1:'#ef6f5e'}}));
}
function drawGrid(vis) {
  const cells = new Map();
  vis.forEach(r => {
    const i = Math.floor(r.lat/CELL_LAT), j = Math.floor(r.lng/CELL_LNG), k = i + ':' + j;
    const c = cells.get(k) || {i, j, n:0, t:{}, killed:0, injured:0};
    c.n++; c.t[r.type] = (c.t[r.type]||0) + 1; c.killed += r.killed; c.injured += r.injured; cells.set(k, c);
  });
  const max = Math.max(1, ...[...cells.values()].map(c => c.n));
  cells.forEach(c => {
    const a = c.n / max, col = a > .75 ? '#ef6f5e' : a > .45 ? '#f2b84b' : a > .2 ? '#5fd4d0' : '#7fb3d5';
    const rows_ = Object.entries(c.t).map(([k,n]) => `${TYPES[k]?.[0]||k}: ${n}`).join('<br>');
    L.rectangle([[c.i*CELL_LAT, c.j*CELL_LNG], [(c.i+1)*CELL_LAT, (c.j+1)*CELL_LNG]],
      {color:col, weight:1, fillColor:col, fillOpacity:.2 + .55*a}).addTo(layer)
      .bindTooltip(String(c.n), {permanent:true, direction:'center', className:'cell'})

//<math>
const RAD = Math.PI/180, ER = 6371000;
function dest(lat, lng, brg, m) {
  const d = m/ER, b = brg*RAD, p1 = lat*RAD, l1 = lng*RAD;
  const p2 = Math.asin(Math.sin(p1)*Math.cos(d) + Math.cos(p1)*Math.sin(d)*Math.cos(b));
  const l2 = l1 + Math.atan2(Math.sin(b)*Math.sin(d)*Math.cos(p1), Math.cos(d) - Math.sin(p1)*Math.sin(p2));
  return [p2/RAD, ((l2/RAD + 540) % 360) - 180];
}
function bearing(a, b) {
  const p1 = a[0]*RAD, p2 = b[0]*RAD, dl = (b[1]-a[1])*RAD;
  return (Math.atan2(Math.sin(dl)*Math.cos(p2), Math.cos(p1)*Math.sin(p2) - Math.sin(p1)*Math.cos(p2)*Math.cos(dl))/RAD + 360) % 360;
}
function distM(a, b) {
  const dp = (b[0]-a[0])*RAD, dl = (b[1]-a[1])*RAD;
  const h = Math.sin(dp/2)**2 + Math.cos(a[0]*RAD)*Math.cos(b[0]*RAD)*Math.sin(dl/2)**2;
  return 2*ER*Math.asin(Math.sqrt(h));
}
// Позиція цілі на момент tms: рух по «етапах» (legs), кожен етап — курс і швидкість від точки зміни.
function posAt(T, tms) {
  const endMs = T.ended_at ? +new Date(T.ended_at) : Infinity, end = Math.min(tms, endMs);
  const legs = T.legs.filter(l => +new Date(l.t) <= end);
  if (!legs.length) return null;
  const pts = legs.map(l => [l.lat, l.lng]), a = legs[legs.length-1];
  const done = T.status === 'ended' && tms >= endMs;
  const head = (done && T.end_lat != null) ? [T.end_lat, T.end_lng] : dest(a.lat, a.lng, a.heading, (end - new Date(a.t))/1000 * a.speed/3.6);
  pts.push(head);
  return {pts, head, heading:a.heading, speed:a.speed, done};

    seen.add(T.id);

  h += T.status === 'active' && !tl.on ? `<br><button class="abtn" data-air="edit" data-id="${T.id}">Змінити курс і швидкість</button>`
                                        : `<br><button class="abtn" data-air="zoom" data-id="${T.id}">Показати весь маршрут</button>`;
  return h;
}
map.on('popupopen', e => e.popup.getElement().querySelectorAll('.abtn').forEach(b => b.onclick = () => {
  map.closePopup(); b.dataset.air === 'edit' ? startEdit(b.dataset.id) : focusAir(b.dataset.id);
}));
function focusAir(id) {
  const T = byId(id), p = T && posAt(T, curTms()); if (!p) return;
  air.vis.set(id, true); air.sel = id; drawAir(); renderAirList();
  map.fitBounds(L.latLngBounds(p.pts).pad(.35), {maxZoom:12});
}

// ---- список і історія ----
function renderAirList() {
  const rows_ = air.list.filter(T => T.status === 'active' || inPeriod(T)).slice(0, 80), now = Date.now();
  const n = air.list.filter(T => T.status === 'active').length;
  $('#airList').innerHTML = (n ? `<div class="hint" style="margin:0 0 4px">У польоті: ${n}</div>` : '') +
    (rows_.map(T => `<div class="arow ${T.status === 'active' ? 'act' : ''}" data-id="${T.id}"><input type="checkbox" ${isVisible(T, now) ? 'checked' : ''} aria-label="Показати маршрут"><span class="t">${esc(aName(T))}</span><small>${T.status === 'active' ? 'у польоті' : (REASON[T.end_reason]?.[0] || 'завершена')}</small></div>`).join('')
     || '<div class="hint">За цей період цілей немає.</div>');
}
$('#airList').onclick = e => {
  const row = e.target.closest('.arow'); if (!row) return;
  if (e.target.type === 'checkbox') { air.vis.set(row.dataset.id, e.target.checked); drawAir(); } else focusAir(row.dataset.id);
};
$('#airAll').onchange = e => { air.showAll = e.target.checked; air.vis.clear(); drawAir(); renderAirList(); };
$('#airPer').onchange = e => { air.period = e.target.value; drawAir(); renderAirList(); };
$('#airTgl').onclick = () => { const o = $('#airBody').hidden; $('#airBody').hidden = !o; $('#airTgl').textContent = o ? '▾' : '▴'; $('#airTgl').setAttribute('aria-expanded', o); };
if (innerWidth < 760) $('#airTgl').click();

// ---- постановка / зміна курсу ----
let ed = null, hdl = null, edLine = null, edPin = null, dragging = false;
$('#aKind').innerHTML = Object.entries(KINDS).map(([k, v]) => `<option value="${k}">${v.name}</option>`).join('');
$('#aKind').onchange = () => { $('#aSpeed').value = KINDS[$('#aKind').value].speed; };
const edPos = () => !ed ? null : ed.mode === 'new' ? ed.start : (byId(ed.id) && posAt(byId(ed.id), Date.now())?.head);
const handleDist = () => 90 * 156543.03 * Math.cos(map.getCenter().lat*RAD) / Math.pow(2, map.getZoom());   // ≈ 90 px
function placeHandle() {
  const pos = edPos(); if (!pos) return;
  const hp = dest(pos[0], pos[1], ed.heading, handleDist());
  if (!hdl) {
    hdl = L.marker(hp, {draggable:true, zIndexOffset:2000, icon:L.divIcon({className:'', html:'<div class="hdl"></div>', iconSize:[18,18]})}).addTo(map);
    hdl.on('dragstart', () => dragging = true);
    hdl.on('drag', () => { const ll = hdl.getLatLng(), p0 = edPos(); ed.heading = Math.round(bearing(p0, [ll.lat, ll.lng])) % 360; $('#aHead').value = ed.heading; updEdLine(); });
    hdl.on('dragend', () => { dragging = false; placeHandle(); });
  } else hdl.setLatLng(hp);
  updEdLine();
}
function updEdLine() {
  const pos = edPos(); if (!pos || !hdl) return; const ll = hdl.getLatLng();
  if (!edLine) edLine = L.polyline([], {color:'#f2b84b', weight:2, dashArray:'6 6', interactive:false}).addTo(map);
  edLine.setLatLngs([pos, [ll.lat, ll.lng]]);
}
function cancelAir() {
  ed = null; dragging = false; document.body.classList.remove('placing');
  [hdl, edLine, edPin].forEach(x => x && map.removeLayer(x)); hdl = edLine = edPin = null;
  $('#airForm').hidden = true; $('#aEnd').hidden = true;
}
function startNew() {
  if (tl.on) return banner('Закрийте таймлайн, щоб додавати цілі', 'info', 3000);
  cancelAir(); closePanel();
  ed = {mode:'new', heading:45, start:null};
  $('#aKind').disabled = false; $('#aKind').onchange(); $('#aHead').value = 45; $('#aLabel').value = ''; $('#aLabel').disabled = false;
  $('#aOk').textContent = 'Запустити'; $('#airHint').textContent = 'Клацніть на карті, де зараз ціль. Жовту точку тягніть, щоб задати курс.';
  $('#airForm').hidden = false; document.body.classList.add('placing');
  if ($('#airBody').hidden) $('#airTgl').click();
}
function startEdit(id) {
  const T = byId(id), p = T && posAt(T, Date.now()); if (!p || tl.on) return;
  cancelAir(); closePanel();
  ed = {mode:'edit', id, heading:Math.round(p.heading)};
  $('#aKind').value = T.kind; $('#aKind').disabled = true; $('#aLabel').value = T.label || ''; $('#aLabel').disabled = true;
  $('#aHead').value = ed.heading; $('#aSpeed').value = p.speed;
  $('#aOk').textContent = 'Застосувати'; $('#airHint').textContent = `${aName(T)}: тягніть жовту точку або введіть курс. Зміни діють із поточної позиції цілі.`;
  $('#airForm').hidden = false; $('#aEnd').hidden = false;
  if ($('#airBody').hidden) $('#airTgl').click();
  placeHandle();
}
$('#airNew').onclick = startNew;
$('#add').addEventListener('click', cancelAir);
$('#aCancel').onclick = cancelAir;
document.addEventListener('keydown', e => { if (e.key === 'Escape' && ed) cancelAir(); });
$('#aHead').oninput = () => { if (!ed) return; ed.heading = ((+$('#aHead').value % 360) + 360) % 360; placeHandle(); };
map.on('click', e => {
  if (!ed || ed.mode !== 'new') return;
  ed.start = [e.latlng.lat, e.latlng.lng];
  if (!edPin) edPin = L.circleMarker(e.latlng, {radius:6, color:'#f2b84b', fillColor:'#0c1a2d', fillOpacity:1, interactive:false}).addTo(map); else edPin.setLatLng(e.latlng);
  placeHandle();
});
map.on('zoomend', () => { if (ed && !dragging) placeHandle(); });

$('#airForm').onsubmit = async e => {
  e.preventDefault(); if (!ed) return;
  const heading = ((Math.round(+$('#aHead').value) % 360) + 360) % 360, speed = Math.max(20, Math.min(12000, +$('#aSpeed').value || KINDS[$('#aKind').value].speed));
  if (ed.mode === 'new') {
    if (!ed.start) return banner('Спершу поставте ціль на карті', 'info', 3000);
    const t = new Date().toISOString();
    const row = {kind:$('#aKind').value, label:$('#aLabel').value.trim() || null, started_at:t, legs:[{t, lat:ed.start[0], lng:ed.start[1], heading, speed}]};
    const {data, error} = await sb.from('air_targets').insert(row).select().single();
    if (error) return banner('Не збережено: ' + error.message, 'err', 8000);
    air.list.unshift(data); air.sel = data.id;
  } else {
    const T = byId(ed.id), p = T && posAt(T, Date.now());
    if (p && (heading !== Math.round(p.heading) || speed !== p.speed)) {
      const leg = {t:new Date().toISOString(), lat:p.head[0], lng:p.head[1], heading, speed};
      const {error} = await sb.rpc('air_append_leg', {p_id:T.id, p_leg:leg});
      if (error) return banner('Не збережено: ' + error.message, 'err', 8000);
      T.legs = [...T.legs, leg];
    }
  }
  cancelAir(); drawAir(); renderAirList();
};
$('#aEndBtn').onclick = async () => {
  const T = ed && ed.mode === 'edit' && byId(ed.id), p = T && posAt(T, Date.now()); if (!p) return;
  const patch = {status:'ended', ended_at:new Date().toISOString(), end_lat:p.head[0], end_lng:p.head[1], end_reason:$('#aReason').value};
  const {error} = await sb.from('air_targets').update(patch).eq('id', T.id);
  if (error) return banner('Не збережено: ' + error.message, 'err', 8000);
  Object.assign(T, patch); cancelAir(); drawAir(); renderAirList();
};

async function loadAir() {
  const {data, error} = await sb.from('air_targets').select('*').order('started_at', {ascending:false}).limit(1000);
  if (error) { $('#airList').innerHTML = '<div class="hint">Немає таблиці air_targets: виконайте schema_air.sql</div>'; return; }
  air.list = data; renderAirList(); drawAir();
}
sb.channel('air').on('postgres_changes', {event:'*', schema:'public', table:'air_targets'}, p => {
  if (p.eventType === 'INSERT' && !byId(p.new.id)) {
    banner('Нова повітряна ціль: ' + aName(p.new), 'err', 10000, () => map.flyTo([p.new.legs[0].lat, p.new.legs[0].lng], 11)); beep();
  }
  loadAir();
}).subscribe();
setInterval(() => { if (!tl.on) drawAir(); if (ed && !dragging) placeHandle(); }, 1000);
loadAir();
</script>
</body>
</html>
